<!DOCTYPE html>
<html lang="en">
<link>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Do List</title>
<link rel="stylesheet" href="to_do_list.css">
</head>

<body>
    <div class="container">
        <div class="wrapper-container">

            <div class="input-wrapper">
                <input id="note" type="text" placeholder=" " />
                <label for="note">Enter your note:</label>
            </div>
            <div class="button-container">
                <div class="button-wrapper">
                    <button id="add-btn">
                        <span>
                            <svg height="20" width="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                <path d="M0 0h24v24H0z" fill="none"></path>
                                <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z" fill="currentColor"></path>
                            </svg>
                            Create
                        </span>
                    </button>
                </div>
                <div class="button-wrapper">
                    <button id="update-btn">
                        <span>
                            Update
                        </span>
                    </button>
                </div>
                <div class="button-wrapper">
                    <button id="remove-btn">
                        <span>
                            Delete
                        </span>
                    </button>
                </div>
            </div>
        </div>
        <div class="list-item-container">
            <ul id="list"></ul>
        </div>
    </div>


    <script src="to_do_list.js"></script>
</body>

</html>
