<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanning Items</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap:10px;
        }
        .item1{
            grid-column: span 2;
            background-color: aqua;
        }
        .item2{
            background-color: lightgreen;
        }
        .item3{
            background-color: lightblue;
        }
        .item4{
            grid-column: span 2;
            background-color: lightgray;
        }
        .item5{
            grid-column: 1/-1;
            background-color: lightcoral;
        }
        .container > div {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
            padding: 20px;
            min-height: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">[    Item 1 spans 2 cols    ]</div>
        <div class="item2">[Item 2]</div>
        <div class="item3">[Item 3]</div>
        <div class="item4">[    Item 4 spans 2 cols   ]</div>
        <div class="item5">[    Item 5 spans all 3 cols       ]</div>
    </div>
</body>
</html>
