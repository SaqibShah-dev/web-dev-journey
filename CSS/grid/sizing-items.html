<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/style.css">
  <title>Sizing Grid Items!</title>
</head>

<body>
  <div class="container">
    <div class="item item1">1</div>
    <div class="item item2">2</div>
    <div class="item item3">3</div>
    <div class="item item4">4</div>
    <div class="item item5">5</div>
    <div class="item item6">6</div>
    <div class="item item7">7</div>
    <div class="item item8">8</div>
    <div class="item item8">💩</div>
    <div class="item item9">9</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
    <div class="item item26">26</div>
    <div class="item item27">27</div>
    <div class="item item28">28</div>
    <div class="item item29">29</div>
    <div class="item item30">30</div>
  </div>

  <style>
    .container {
      display: grid;
      grid-gap: 20px;
      grid-template-columns: repeat(5, 1fr);
    }

    .item9 {
      background: mistyrose;
      grid-column: span 10;  /* stretch across 10 columns */
      grid-row: span 2;      /* default - 1 row height */

      /* grid-column: 1 / 4;    from column line 1 to line 4 (spans 3 columns) 
      grid-row: 1 / 3;       from row line 1 to line 3 (spans 2 rows)  */

/* 
      Col 1   Col 2   Col 3   Col 4   Col 5   Col 6   Col 7   Col 8   Col 9   Col 10  Col 11  Col 12
  +-------+-------+-------+-------+-------+-------+-------+-------+-------+-------+-------+-------+
R1|                                                                               | Normal| Normal|
  |                         YOUR ITEM (Spans 10 columns wide)                     | Item  | Item  |
R2|                                                                               +-------+-------+
  |                         YOUR ITEM (Spans 2 rows tall)                         | Normal| Normal|
  +-------------------------------------------------------------------------------+ Item  | Item  |
R3| Normal| Normal| Normal| Normal| Normal| Normal| Normal| Normal| Normal| Normal+-------+-------+ */
    }
  </style>
</body>

</html>
