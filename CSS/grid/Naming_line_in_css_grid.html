<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/style.css">
  <title>Naming Lines in CSS Grid!</title>
</head>

<body>
  <div class="container">
    <div class="item item1">1</div>
    <div class="item item2">2</div>
    <div class="item item3">3</div>
    <div class="item item4">4</div>
    <div class="item item5">5</div>
    <div class="item item6">6</div>
    <div class="item item7">7</div>
    <div class="item item8">8</div>
    <div class="item item9">9</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
    <div class="item item26">26</div>
    <div class="item item27">27</div>
    <div class="item item28">28</div>
    <div class="item item29">29</div>
    <div class="item item30">30</div>
  </div>

  <style>
    .container {
      display: grid;
      grid-gap: 20px;

       /* | Line 1           |Line 2               | Line 3       | Line 4     |
       | [sidebar-start]     | [sidebar-end]       | [content-end] | [site-right]
       | [site-left]         | [content-start]     |              |            |
       |        1fr          |       500px         |      1fr     |
        */
      grid-template-columns: [sidebar-start site-left] 1fr [sidebar-end content-start] 500px [content-end] 1fr [site-right];
      grid-template-rows: [content-top] repeat(10, auto) [content-bottom];
/* 
      Line 1: [content-top]
        ↓
     Row 1 (auto)
     Line 2
        ↓
     Row 2 (auto)
     Line 3
        ↓
     Row 3 (auto)
      ...
     Line 11
        ↓
     Row 10 (auto)
      Line 12: [content-bottom] */
    }

    .item3 {
      background: slateblue;
      grid-column: content-start;
      /* grid-row: content-top / content-bottom; */
      grid-row: 1 / span 10;
    }
    .item1{
        background: tomato;
        grid-column: sidebar-start / sidebar-end;
        grid-row: content-top / content-bottom;
        }
         .item2{
        background: orange;
        grid-column: site-right;
        grid-row: content-top / content-bottom;
    }
  </style>
</body>

</html>
