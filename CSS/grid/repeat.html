<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/style.css">
    <title>CSS Grid repeat Function!</title>
</head>

<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
        <div class="item">11</div>
        <div class="item">12</div>
        <div class="item">13</div>
        <div class="item">14</div>
        <div class="item">15</div>
    </div>

    <style>
        .container {
            display: grid;
            grid-gap: 20px;
            /* repeat(2, 1fr auto) = expands to 1fr auto 1fr auto
repeat(2, 5fr) = expands to 5fr 5fr
What this means is that the first column will be 100px, the second column will get 1 share 
of the remaining space, the third column will size based on content width, the fourth column 
will get 1 share of the remaining space, the fifth column will be 200px, and the sixth and 
seventh columns will each get 5 shares of the remaining space. */
            grid-template-columns: 100px repeat(2, 1fr auto) 200px repeat(2, 5fr);
        }

        .item {
            background: blue;
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</body>

</html>
