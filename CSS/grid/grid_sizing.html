<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/style.css">
    <title>Sizing Tracks in CSS Grid!</title>
</head>

<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">Wes Bos Is Cool</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
        <div class="item">11</div>
        <div class="item">12</div>
        <div class="item">13</div>
        <div class="item">14</div>
        <div class="item">15</div>
    </div>

    <style>
        .container {
            display: grid;
            height: 600px;
            grid-gap: 20px;
            border: 10px solid var(--yellow);
            /* auto (column 1) — sizes based on content width
1fr (column 2) — gets 1 share of remaining space
auto (column 3) — sizes based on content width
1fr (column 4) — gets 1 share of remaining space */
            grid-template-columns: auto 1fr auto 1fr;
        }

        .item {
            background: blue;
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</body>

</html>
