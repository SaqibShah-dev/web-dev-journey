<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content=
        "width=device-width, initial-scale=1.0" />

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .parent {
            padding: 1px;
            background-color: lightgray;
        }

        .child {
            margin: 10px;
            height: 50px;
            width: 50px;
            background-color: teal;
        }
        h1{
            color: green;
        }
    </style>

    <title>
        Adding Padding to the Parent Element
    </title>
</head>

<body>
    <h1>
        GeeksforGeeks
    </h1>
    
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>

</html>
