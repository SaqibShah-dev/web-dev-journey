<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content=
        "width=device-width, initial-scale=1.0" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .parent {
            background-color: lightgray;
        }

        .child {
            float: left;
            margin: 10px;
            height: 50px;
            width: 50px;
            background-color: black;
        }
        h1{
            color: green;
        }
        #myDiv{
            clear: both;
            margin: 10px;
            height: 50px;
            width: 50px;
            background-color: black;
        }
    </style>
    <title> Using float property</title>
</head>

<body>
    <h1>
        GeeksforGeeks
    </h1>
    
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
        <div id="myDiv"></div>
    </div>
</body>

</html>
