<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1</title>
  <style>
    body { padding: 30px; font-family: Arial; }

    .box {
      width: 300px;
      padding: 30px;
      border: 10px solid black;
      background-color: lightcoral;
      margin-bottom: 20px;
    }

    /* box-content width calculation */
    /* rendered width = width + padding-left + padding-right + border-left + border-right */
    /* rendered width = 300 + 30+ 30 + 10 + 10 = 380px */
    /* height is auto increase its size according to content */
    /* rendered height = height + padding-top + padding-bottom + border-top + border-bottom */
    /* rendered height = 0 + 30+ 30 + 10 + 10 = 80px */
    .content { box-sizing: content-box; }

    /* border-box width calculation */
    /* rendered width = width */
     /* height is auto increase its size according to content */
    /* rendered height = height */
    .border  { box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="box content">content-box — how wide am I really?</div>
  <div class="box border">border-box — how wide am I really?</div>
</body>
</html>
