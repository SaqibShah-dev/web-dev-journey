<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 40px;
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background-color: #0070f3;
      color: white;
      margin-bottom: 30px;
      border-radius: 8px;
    }

    .card {
      padding: 24px;
      background-color: white;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .card h2 {
      margin-bottom: 8px;
      color: #111;
    }

    .card p {
      margin-bottom: 20px;
      color: #555;
    }

    button {
      padding: 10px 24px;
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Portfolio</h1>
  </header>

  <main>
    <div class="card">
      <h2>Saqib Shah</h2>
      <p>I am an undergraduate student of BSAI at PMAS AAUR in Pakistan.</p>
      <button>Contact Me</button>
    </div>
  </main>

  <footer>
    <p>© 2025 Saqib Shah</p>
  </footer>

</body>
</html>
