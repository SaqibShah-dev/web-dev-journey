<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Level Element Modifier</title>
    <style>
        /* Block */
        .card {
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Modifier — featured version */
        .card--featured {
            border: 2px solid var(--primary);
        }

        /* Elements */
        .card__image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card__body {
            padding: 1.5rem;
        }

        .card__title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .card__description {
            color: #555;
            margin-bottom: 1rem;
        }

        /* Button block */
        .button {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .button--primary {
            background-color: var(--primary);
            color: white;
        }

        .button--danger {
            background-color: #e63946;
            color: white;
        }

        .button--outline {
            background-color: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
    </style>
</head>

<body>
    <!-- BEM = Block__Element--Modifier
         ↑       ↑        ↑
     component  part    variation -->
    <!-- /* A standalone component */
      Block — The Component
       .card { }
       .navbar { }
        .button { }
       .form { } -->

    <!-- Element — A Part of the Block
        /* Part of a component — uses double underscore __ */
        .card__image { }      /* image inside card */
        .card__title { }      /* title inside card */
        .card__body { }       /* body inside card */
        .navbar__logo { }     /* logo inside navbar */
        .navbar__links { }    /* links inside navbar */
        .form__input { }      /* input inside form */
        .form__label { }      /* label inside form */ -->

    <!-- Modifier — A Variation
        /* Different version of block or element — uses double dash -- */
        .button--primary { }     /* primary button */
        .button--danger { }      /* red/danger button */
        .button--large { }       /* large button */
        .card--featured { }      /* highlighted card */
        .form__input--error { }  /* input with error state */ -->

    <div class="card card--featured">
        <img class="card__image" src="../../images/album1.png" alt="..." />
        <div class="card__body">
            <h3 class="card__title">Mountain Peak</h3>
            <p class="card__description">Beautiful view...</p>
            <button class="button button--primary">Read More</button>
        </div>
    </div>
</body>

</html>
