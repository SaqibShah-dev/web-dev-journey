<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            <img class="netflix-logo" src="./images/netflix-logo.png" alt="Logo" />
        </div>
        <div class="signin-btn">
            <button>Sign in</button>
        </div>
    </header>
    <div class="landing-page-layout">
        <div class="page-layout">
            <div class="hero-section">
                <div class="background-image">
                    <img class="netflix-background-image" src="./images/netflix-bg-image.png" alt="Background image" />
                </div>
                <div class="form-submit">
                    <div class="form-detail">
                        <h1>Unlimited movies, TV shows, and more</h1>
                        <p>Starts at Rs 250. Cancel anytime.</p>
                    </div>
                    <form>
                        <h3>Ready to watch? Enter your email to create or restart your membership.</h3>
                        <div class="submit-detail">
                            <div class="input-wrapper">
                                <input type="email" id="email" placeholder=" " />
                                <label for="email">Email Address</label>
                            </div>
                            <button type="submit" id="signin-btn">Get Started</button>
                            <div class="submit-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round" style="width: 24px; height: 24px; color: #ffffff;">
                                    <polyline points="5 4 19 12 5 20"></polyline>
                                </svg>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="red-line"></div>
            <div class="container">
                <div class="landing-page-content">
                    <div class="page-content-heading">
                        <h2>Trending News</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
