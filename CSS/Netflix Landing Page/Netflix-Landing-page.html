<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            <img class="netflix-logo" src="./images/netflix-logo.png" alt="Logo" />
        </div>
        <div class="signin-btn">
            <button>Sign in</button>
        </div>
    </header>
    <div class="landing-page-layout">
        <div class="page-layout">
            <div class="hero-section">
                <div class="background-image">
                    <img class="netflix-background-image" src="./images/netflix-bg-image.png" alt="Background image" />
                </div>
                <div class="hero__overlay"></div>
                <div class="form-submit">
                    <div class="form-detail">
                        <h1>Unlimited movies, TV shows, and more</h1>
                        <p>Starts at Rs 250. Cancel anytime.</p>
                    </div>
                    <form>
                        <h3>Ready to watch? Enter your email to create or restart your membership.</h3>
                        <div class="submit-detail">
                            <div class="input-wrapper">
                                <div class="email-input-box">
                                    <input type="email" id="email" placeholder=" " />
                                </div>
                                <label class="input-wrapper-label" for="email">Email Address</label>
                            </div>

                            <div class="submit-icon">
                                <button type="submit" id="signin-btn">Get Started</button>
                                <svg class="submit-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="5 4 19 12 5 20"></polyline>
                                </svg>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="section-divider">
                <div class="red-line"></div>
            </div>
            <div class="container">
                <div class="landing-page-content">
                    <div class="page-content-heading">
                        <h2>Trending News</h2>
                        <div class="trending-news-items">
                            <div class="trending-item">
                                <ul class="items">
                                    <li class="item"><img src="./images/movie-image1.png" alt="Movie1" /><span>1</span>
                                    </li>
                                    <li class="item"><img src="./images/movie-image2.png" alt="Movie2" /><span>2</span>
                                    </li>
                                    <li class="item"><img src="./images/movie-image3.png" alt="Movie3" /><span>3</span>
                                    </li>

                                    <li class="item"><img src="./images/movie-image4.png" alt="Movie4" /><span>4</span>
                                    </li>

                                    <li class="item"><img src="./images/movie-image5.png" alt="Movie5" /><span>5</span>
                                    </li>

                                    <li class="item"><img src="./images/movie-image6.png" alt="Movie6" /><span>6</span>
                                    </li>

                                    <li class="item"><img src="./images/movie-image7.png" alt="Movie7" /><span>7</span>
                                    </li>

                                    <li class="item"><img src="./images/movie-image8.png" alt="Movie8" /><span>8</span>
                                    </li>

                                    <li class="item"><img src="./images/movie-image9.png" alt="Movie9" /><span>9</span>
                                    </li>

                                    <li class="item"><img src="./images/movie-image10.png" alt="Movie10" /><span>10</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>    
        </div>
    </div>
</body>

</html>
