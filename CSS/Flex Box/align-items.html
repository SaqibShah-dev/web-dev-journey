<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Items</title>
    <style>
        .container{
            margin: 10px;
            padding: 10px;
            border: 1px solid black;
        }
        .flex-start-container {
            height: 200px;
            border: 1px solid black;
            display: flex;
            align-items: flex-start;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 20px;
        }

        .flex-end-container {
            height: 200px;
            border: 1px solid black;
            display: flex;
            align-items: flex-end;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 20px;
        }

        .space-between-container {
            height: 200px;
            border: 1px solid black;
            display: flex;
            justify-content: space-between;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 20px;
        }

        .stretch-container {
            height: 200px;
            border: 1px solid black;
            display: flex;
            align-items: stretch;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 20px;
        }

        .baseline-container {
            height: 200px;
            border: 1px solid black;
            display: flex;
            align-items: baseline;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 20px;
        }

        .center-container {
            height: 200px;
            border: 1px solid black;
            display: flex;
            align-items: center;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 20px;
        }
        .card {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>

<body>
    <div class="container">
            <h1>Align Items: flex-start</h1>
    <div class="flex-start-container">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>

        <div class="card">12</div>
    </div>
    </div>
    <div class="container">
            <h1>Align Items: flex-end</h1>
    <div class="flex-end-container">
        <div class="card">1</div>
        <div class="card">2</div>

        <div class="card">11</div>
        <div class="card">12</div>
    </div>
    </div>
    <div class="container">
            <h1>Align Items: stretch</h1>
    <div class="stretch-container">
        
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
        <div class="card">7</div>
        <div class="card">8</div>
        <div class="card">9</div>
        <div class="card">10</div>
        <div class="card">11</div>
        <div class="card">12</div>
    </div>
    </div>
    <div class="container">
        <h1>Align Items: baseline</h1>
    <div class="baseline-container">
        
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
        <div class="card">7</div>

    </div>
    <div class="container">
                <h1>Align Items: center</h1>
    <div class="center-container">
        
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>

</body>

</html>
