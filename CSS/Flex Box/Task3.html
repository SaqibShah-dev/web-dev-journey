<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: cadetblue;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .hero-section h1 {
            font-size: 3em;
            margin: 0;
            padding: 0;

        }

        .hero-section p {
            font-size: 1.5em;
            margin: 0;
            padding: 0;
        }

        .hero-section button {
            padding: 15px 25px;
            color: white;
            background-color: rgb(30, 194, 200);
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            cursor: pointer;
        }

        .hero-section button {
            transition: background-color 0.3s ease;
        }

        .hero-section button:hover {
            background-color: rgb(4, 252, 252);
        }
    </style>
</head>

<body>
    <div class="hero-section">
        <h1>Hi, I'm Saqib Shah</h1>
        <p>BS AI Student · Pakistan </p>
        <button>Hire Me</button>
    </div>
</body>

</html>
