<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.container { width: 100%; background-color: red; }  /* mobile default */
h3{
    /* clamp(minimum, preferred, maximum) */
font-size: clamp(1rem, 2.5vw, 2rem);
/* never below 1rem */
/* scales with viewport */
/* never above 2rem */
}
@media (min-width: 768px) {
  .container { width: 750px; background-color: blue; } /* tablet */
}
@media (min-width: 1024px) {
  .container { width: 960px; background-color: green; } /* desktop */
}
</style>
</head>
<body>
    <div class="container"><h3>Mobile First Design</h3></div>
</body>
</html>
