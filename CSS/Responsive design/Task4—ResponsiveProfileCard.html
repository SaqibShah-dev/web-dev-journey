<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 Responsive Profile Card</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .card{
            width: 100%;
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            border: 2px solid black;
        }
        .card img{
            width:clamp(80px, 20vw, 150px)
        }
        @media(min-width:1024px){
            .card{
                display:flex;
                justify-content: flex-start;
                align-items: center;
                flex-basis: 500px;
            }
            h2{
                font-size: 1.5rem;
            }
             p{
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="../../images/album1.png" alt="Profile Picture">
            <h2>John Doe</h2>
        <p>Web Developer</p>
        <button>Contact</button>
    </div>
</body>
</html>
