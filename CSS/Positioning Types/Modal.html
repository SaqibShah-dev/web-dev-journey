<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 Model Box</title>
    <style>
            * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }
        /* PAGE CONTENT */
    .page-content {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
        .open-btn {
      padding: 0.75rem 2rem;
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
     .open-btn:hover { background-color: #005ecb; }
         /* LAYER 1 — Dark Overlay */
    .dark-overlay {
      position: fixed;        /* covers viewport */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 100;
    }
        /* LAYER 2 — Modal Box */
    .modal-box {
      position: fixed;        /* on top of overlay */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%); /* perfect center */
      z-index: 200;

      background-color: white;
      border-radius: 12px;
      padding: 2rem;
      width: 90%;
      max-width: 400px;

      display: flex;
      flex-direction: column;
      gap: 1rem;
    }


    /* Close button — top right of modal */
    .modal__close {
      position: absolute;     /* relative to modal-box */
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #555;
      transition: color 0.2s ease;
    }
        .modal__close:hover { color: #111; }

    .modal__title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #111;
    }

    .modal__text {
      color: #555;
      font-size: 1rem;
    }
       .modal__actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }

    .modal__btn {
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .modal__btn--confirm {
      background-color: #0070f3;
      color: white;
    }
        .modal__btn--confirm:hover { background-color: #005ecb; }

    .modal__btn--cancel {
      background-color: #eee;
      color: #333;
    }

    .modal__btn--cancel:hover { background-color: #ddd; }
    </style>
</head>

<body>
    <div class="page-content">
        <button class="open-btn">Delete Account</button>
    </div>
    <div class="dark-overlay">

        <!-- Modal Box — Layer 2 -->
        <div class="modal-box">

            <!-- Close button — position absolute inside modal -->
            <button class="modal__close">✕</button>

            <h4 class="modal__title">Are you sure?</h4>
            <p class="modal__text">
                This action cannot be undone.
                Your account will be permanently deleted.
            </p>

            <div class="modal__actions">
                <button class="modal__btn modal__btn--cancel">Cancel</button>
                <button class="modal__btn modal__btn--confirm">Yes, Delete</button>
            </div>

        </div>
    </div>
</body>

</html>
