<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Variable Example</title>

  <style>
    /* 1) Define variables on :root (global) */
    :root {
      --bg-color: #f5f5f5;
      --text-color: #333333;
      --accent-color: #007bff;
      --card-radius: 10px;
      --card-padding: 16px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .card {
      background-color: white;
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      max-width: 400px;
      margin: 40px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card h1 {
      color: var(--accent-color);
      margin-top: 0;
    }

    .card a {
      color: var(--accent-color);
      text-decoration: none;
    }

  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Variables</h1>
    <p>This card uses CSS variables for colors, radius, and padding.</p>
    <a href="#">Learn more</a>
  </div>
</body>
</html>
