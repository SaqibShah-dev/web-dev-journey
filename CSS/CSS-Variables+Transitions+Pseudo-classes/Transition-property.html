        /* Shorthand transition */
        .box {
            width: 100px;
            height: 100px;
            background-color: coral;

            /* property | duration | timing-function | delay */

            transition: background-color 0.8s ease-in-out 0.25s;
        }

        .box:hover {
            background-color: purple;
        }

        .overlay {
            width: 200px;
            height: 100px;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;

            opacity: 0.2;
            transition: opacity 0.3s ease;
        }

        .overlay:hover {
            opacity: 1;
        }
    </style>

<body>
    <div class="box"></div>
    <div class="overlay">Hello</div>
